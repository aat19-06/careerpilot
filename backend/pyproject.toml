[project]
name = "careerpilot-backend"
version = "0.1.0"
description = "Backend API for CareerPilot AI"
requires-python = ">=3.11"
#These are the packages required for the application itself.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]
#Ruff will be our linter + formatter. It will catch things like unused imports, bad formatting, and common Python mistakes.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.13"
strict = true